name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go-version: [1.27]
        pg-version: [16, 17, 18]
        include:
          - pg-version: 16
          - pg-version: 17
          - pg-version: 18

    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Setup database server for testing
      run: ci/setup_test.bash
      env:
        PGVERSION: ${{ matrix.pg-version }}

    - name: Build iidy
      run: go build -v -o iidy ./cmd/iidy

    - name: Run iidy
      id: iidyserver
      run: ./iidy
      background: true

    - name: Test
      env:
        INTEGTEST_DESTROY_DB_URL: "postgres://postgres:postgres@localhost:5432/postgres"
        INTEGTEST_DESTROY_DB_I_MEAN_IT: "true"
        INTEGTEST_SERVER: "true"

      run: go test -race ./...

    - name: Stop iidy
      cancel: iidyserver
